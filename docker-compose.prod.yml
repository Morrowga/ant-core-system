services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workforce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" published to the host -- only api/worker/beat (same
    # Docker network) need to reach this, not the outside world.

  redis:
    image: redis:7-alpine
    # Same reasoning -- internal only, no host port published.

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/data/uploads
    # No ".:/app" bind mount (that was for live-reload in dev only) and
    # no --reload flag -- this runs the actual built image, not live
    # host code. No "ports:" published either -- Caddy is the only
    # public entry point, reverse-proxying to this over the internal
    # Docker network by service name ("api"), not localhost.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/data/uploads
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
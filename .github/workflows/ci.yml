name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a manual "Run workflow" button in the GitHub Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Named "workforce" (not "workforce_test") DELIBERATELY --
          # Settings.DATABASE_URL / DATABASE_URL_SYNC both default to
          # localhost:5432/workforce, so matching that name here means
          # neither needs to be overridden below at all.
          POSTGRES_DB: workforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        # Same reasoning -- REDIS_URL/CELERY_BROKER_URL/
        # CELERY_RESULT_BACKEND all default to localhost:6379/*.
        ports:
          - 6379:6379

    env:
      # DATABASE_URL, DATABASE_URL_SYNC, REDIS_URL, CELERY_BROKER_URL,
      # CELERY_RESULT_BACKEND, every STRIPE_* key, and OPENAI_API_KEY all
      # have defaults in Settings that already match this CI setup --
      # deliberately NOT set here, so this only overrides what actually
      # needs a real value to avoid a pydantic-settings ValidationError
      # at import time (Settings() is instantiated at module import via
      # `settings = get_settings()` in config.py, so a missing required
      # field fails before any test even runs).
      JWT_SECRET_KEY: test-secret-not-for-production

      # SMTP_* has NO default in Settings -- required, so these are
      # mandatory here regardless of what any individual test touches.
      # Dummy values only; nothing in CI actually sends email.
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USERNAME: test
      SMTP_PASSWORD: test
      SMTP_FROM_ADDRESS: test@example.com

      # Default (/data/uploads) doesn't exist on this runner -- redirected
      # to a writable temp path (created in its own step below) so any
      # test that writes a file (certificates, etc.) doesn't fail on a
      # missing directory.
      UPLOAD_DIR: /tmp/uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create upload directory
        run: mkdir -p /tmp/uploads

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # This is what makes it continuous DELIVERY instead of continuous
    # DEPLOYMENT: deploy only runs when this workflow run was started
    # by a manual click of "Run workflow" in the Actions tab
    # (github.event_name == 'workflow_dispatch') -- never automatically
    # on a plain push. A push to main still runs the `test` job above
    # automatically, but deploying is now a deliberate separate action,
    # not something that happens the instant tests pass.
    #
    # (Originally tried gating this with a GitHub "environment" +
    # required reviewers instead, but that protection rule is a paid
    # feature for private repos -- this achieves the same practical
    # "click a button to deploy" result without needing that.)
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ants-backend
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build